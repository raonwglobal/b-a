# b/a — Cloudflare Pages only (OpenNext / wrangler deploy 완전 배제)
#
# Cloudflare 대시보드 Git 빌드가 OpenNext 를 주입하는 경우가 많음.
# 이 워크플로만 배포에 사용하고, CF 자동 빌드는 끄세요.
#
# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# Optional: CLOUDFLARE_PAGES_PROJECT (default: b-a)

name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: static build + pages deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check secrets
        id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN / ACCOUNT_ID 없음 — 배포 스킵"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Guard no OpenNext
        if: steps.check.outputs.skip != 'true'
        run: node scripts/guard-no-opennext.mjs

      - name: Install
        if: steps.check.outputs.skip != 'true'
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build static export
        if: steps.check.outputs.skip != 'true'
        run: npm run build

      - name: Verify out/
        if: steps.check.outputs.skip != 'true'
        run: test -f out/index.html

      - name: Deploy via pages deploy ONLY
        if: steps.check.outputs.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          PROJECT="${PROJECT_NAME:-b-a}"
          npx --yes wrangler@4 pages deploy out --project-name="$PROJECT"
