# b/a — 정적 빌드 검증 (OpenNext / wrangler deploy 사용 안 함)

name: Build (static export)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: next build → out/
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Assert static export config
        run: |
          node -e "
            const c = require('./next.config.js');
            if (c.output !== 'export') process.exit(1);
            console.log('OK: output=export');
          "

      - name: Build
        run: npm run build

      - name: Assert out/
        run: |
          test -f out/index.html
          test -f functions/api/contact.ts
          find out -maxdepth 2 -type f | head -30
          du -sh out

      - uses: actions/upload-artifact@v4
        with:
          name: static-out
          path: out
          retention-days: 7
