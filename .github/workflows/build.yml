name: Build (static export)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: next build → out/
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Guard no OpenNext
        run: node scripts/guard-no-opennext.mjs
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Build
        run: npm run build
      - name: Assert out/
        run: |
          test -f out/index.html
          test -f functions/api/contact.ts
          du -sh out
      - uses: actions/upload-artifact@v4
        with:
          name: static-out
          path: out
          retention-days: 7
