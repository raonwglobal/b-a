name: Build (static export)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: cf-safe-build → out/
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build (static verify)
        run: npm run build
      - name: Assert out/ and functions
        run: |
          test -f out/index.html
          test -f functions/api/contact.ts
          du -sh out
      - uses: actions/upload-artifact@v4
        with:
          name: static-out
          path: out
          retention-days: 7
