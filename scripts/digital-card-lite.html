<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>b/a Digital Card · Bamboo Asia</title>
<meta name="robots" content="noindex"/>
<style>
:root{--cream:#F9F5EB;--ink:#0C1611;--green:#16A34A;--gold:#C2A77A;--muted:rgba(12,22,17,.55)}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:system-ui,-apple-system,sans-serif;background:#0C1611;color:var(--cream);display:flex;flex-direction:column;align-items:center;padding:1.5rem 1rem 3rem}
.card-wrap{perspective:1200px;width:100%;max-width:380px;margin:1rem auto}
.card{position:relative;width:100%;aspect-ratio:1.6/1;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.4,.0,.2,1);cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;overflow:hidden;display:flex;flex-direction:column;padding:1.35rem 1.4rem}
.front{background:linear-gradient(145deg,#F9F5EB 0%,#F0EAD6 100%);color:var(--ink);box-shadow:0 20px 50px rgba(0,0,0,.35)}
.back{background:linear-gradient(160deg,#0C1611 0%,#15221a 100%);color:var(--cream);transform:rotateY(180deg);box-shadow:0 20px 50px rgba(0,0,0,.4)}
.logo{width:42px;height:42px;border-radius:12px;background:var(--ink);color:var(--cream);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;letter-spacing:-.02em}
.front .logo{background:var(--ink);color:var(--cream)}
.back .logo{background:var(--cream);color:var(--ink)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.1rem}
.name{font-size:1.35rem;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.en{font-size:12px;opacity:.55;margin-top:2px}
.role{font-size:12px;color:var(--green);font-weight:600;margin-top:.35rem}
.loc{font-size:11px;opacity:.5;margin-top:.6rem;line-height:1.5}
.qr-front{width:56px;height:56px;border-radius:10px;background:#fff;padding:4px;border:1px solid rgba(12,22,17,.1);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 14px rgba(12,22,17,.08)}
.qr-front img,.qr-front canvas{width:100%!important;height:100%!important;display:block}
.services{display:grid;grid-template-columns:1fr 1fr;gap:.45rem;margin:1rem 0 auto}
.svc{font-size:11px;padding:.4rem .55rem;border-radius:8px;background:rgba(12,22,17,.05);border:1px solid rgba(12,22,17,.06)}
.back .svc{background:rgba(249,245,235,.06);border-color:rgba(249,245,235,.1)}
.qr-wrap{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;padding-top:1rem}
.qr-box{width:88px;height:88px;border-radius:12px;background:#F9F5EB;padding:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.qr-box img,.qr-box canvas{width:100%!important;height:100%!important;display:block}
.qr-label{font-size:10px;opacity:.45;letter-spacing:.06em;text-transform:uppercase;text-align:right;line-height:1.45}
.actions{display:flex;gap:.6rem;margin-top:1.25rem;width:100%;max-width:380px}
.btn{flex:1;height:44px;border-radius:12px;border:0;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.4rem;text-decoration:none;color:inherit}
.btn-green{background:var(--green);color:#fff}
.btn-outline{background:transparent;border:1px solid rgba(249,245,235,.2);color:var(--cream)}
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:#fff;color:#0C1611;padding:.65rem 1.1rem;border-radius:999px;font-size:13px;font-weight:500;box-shadow:0 8px 30px rgba(0,0,0,.25);opacity:0;transition:opacity .3s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
.hint{font-size:11px;opacity:.4;margin-top:1.5rem;text-align:center;line-height:1.6;max-width:320px}
a.home{color:var(--gold);text-decoration:none;font-size:12px;margin-top:1rem;opacity:.7}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vROc_VAnbXFlbCyCAYvO4P0R6fEJgktqkNCrvShvUzgHBCv-10R5kXprgRpQFuYXM29tTXMTWp7eFXz/pub?gid=0&single=true&output=csv';
const SITE = 'https://b-a.bambooasia.biz';
function parseCsv(text){const lines=text.replace(/^\uFEFF/,'').trim().split(/\r?\n/);if(lines.length<2)return[];const headers=lines[0].split(',').map(h=>h.trim());const rows=[];for(let i=1;i<lines.length;i++){if(!lines[i].trim())continue;const cols=lines[i].split(',');const row={};headers.forEach((h,idx)=>{row[h]=(cols[idx]||'').trim()});if(row.id)rows.push(row)}return rows}
function phoneDigits(phone){const d=String(phone||'').replace(/[^\d+]/g,'');if(d.startsWith('+'))return d;if(d.startsWith('84'))return '+'+d;return d}
function buildVCard(m){const name=m.name_en||m.name_kr||m.id;const nameKr=m.name_kr||name;const phone=m.phone||'+84 093 685 0555';const email=m.email||'info@bambooasia.biz';const title=m.title_en||m.title_kr||'Representative';return ['BEGIN:VCARD','VERSION:3.0','N:'+name+';;;;','FN:'+nameKr+' / '+name,'ORG:b/a · Bamboo Asia','TITLE:'+title,'TEL;TYPE=CELL:'+phoneDigits(phone),'EMAIL:'+email,'URL:'+SITE,'NOTE:Vietnam Business Execution Platform','END:VCARD'].join('\n')}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200)}
function downloadVCard(m){const v=buildVCard(m);const blob=new Blob([v],{type:'text/vcard;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(m.name_en||m.id||'contact')+'.vcf';a.click();URL.revokeObjectURL(a.href);toast('vCard 저장됨 · 연락처 앱에서 열기')}
function renderQr(el,text,px){if(!el)return;el.innerHTML='';try{if(typeof QRCode!=='undefined'){new QRCode(el,{text:text,width:px,height:px,colorDark:'#0C1611',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});return}}catch(e){}const img=document.createElement('img');img.alt='vCard QR';img.src='https://api.qrserver.com/v1/create-qr-code/?size='+px+'x'+px+'&margin=0&data='+encodeURIComponent(text);el.appendChild(img)}
function renderCard(m){const roleLine=m.title_en?`${m.title_en} / 베트남 사업 실행 플랫폼`:m.title_kr?`${m.title_kr} / 베트남 사업 실행 플랫폼`:'Representative / 베트남 사업 실행 플랫폼';const phone=m.phone||'+84 093 685 0555';const email=m.email||'info@bambooasia.biz';const nameKr=m.name_kr||m.name_en||m.id;const nameEn=m.name_en||m.name_kr||m.id;const vcard=buildVCard(m);document.title='b/a Digital Card · '+nameKr+' · Bamboo Asia';const app=document.getElementById('app');app.innerHTML=`
<div class="card-wrap"><div class="card" id="card">
  <div class="face front">
    <div class="top"><div class="logo">b/a</div><div class="qr-front" id="qrFront"></div></div>
    <div class="name">${nameKr}</div>
    <div class="en">${nameEn}</div>
    <div class="role">${roleLine}</div>
    <div class="loc">Ho Chi Minh City · Seoul<br><span style="opacity:.7;letter-spacing:.08em">Scan QR · 연락처</span></div>
  </div>
  <div class="face back">
    <div class="top"><div class="logo">b/a</div></div>
    <div class="services">
      <div class="svc">Entry · 법인설립</div><div class="svc">Deal · M&A</div>
      <div class="svc">Localization</div><div class="svc">Ops · 운영지원</div>
    </div>
    <div class="qr-wrap">
      <div class="qr-box" id="qrBox"></div>
      <div class="qr-label">Scan to save contact<br>vCard · 연락처 저장<br>Google / Apple</div>
    </div>
  </div>
</div></div>
<div class="actions">
  <a class="btn btn-outline" href="tel:${phoneDigits(phone)}">전화</a>
  <a class="btn btn-outline" href="mailto:${email}">이메일</a>
  <button class="btn btn-green" type="button" id="vcardBtn">연락처 저장</button>
</div>
<p class="hint">카드를 탭하면 앞/뒤 전환<br>1) <b>연락처 저장</b> 버튼 → vCard 다운로드<br>2) 전면·후면 <b>QR 스캔</b> → 카메라로 바로 연락처 추가<br>3) Google Wallet: 저장된 QR 이미지를 Wallet → 추가 → 사진 으로도 등록 가능</p>
<a class="home" href="/">b/a home</a>`;
const card=document.getElementById('card');
card.addEventListener('click',e=>{if(e.target.closest('a,button,input,.qr-box,.qr-front'))return;card.classList.toggle('flipped')});
renderQr(document.getElementById('qrFront'), vcard, 96);
renderQr(document.getElementById('qrBox'), vcard, 140);
document.getElementById('vcardBtn').onclick=()=>downloadVCard(m);
}
function renderList(members){const app=document.getElementById('app');app.innerHTML=`<h1 style="font-size:1rem;letter-spacing:.12em;text-transform:uppercase;opacity:.7;margin-bottom:1.5rem">Digital Cards</h1>`+members.map(m=>`<a href="/card/${m.id}/" style="display:flex;align-items:center;gap:1rem;padding:1rem;border-radius:16px;background:rgba(249,245,235,.06);border:1px solid rgba(249,245,235,.12);color:inherit;text-decoration:none;width:100%;max-width:380px;margin-bottom:.75rem"><div style="width:40px;height:40px;border-radius:10px;background:#F9F5EB;color:#0C1611;display:flex;align-items:center;justify-content:center;font-weight:700">b/a</div><div style="flex:1"><div style="font-weight:600">${m.name_kr||m.name_en}</div><div style="font-size:12px;opacity:.55">${m.name_en||''}</div><div style="font-size:11px;opacity:.45;margin-top:2px">${m.title_kr||m.title_en||''}</div></div><div style="opacity:.4">→</div></a>`).join('')+`<p style="opacity:.35;font-size:11px;margin-top:2rem"><a href="/" style="color:#C2A77A">b/a home</a></p>`}
async function main(){const path=location.pathname.replace(/\/+$/,'').split('/');const id=path[path.length-1]==='card'?null:path[path.length-1];let members=[];try{const res=await fetch(CSV_URL);if(res.ok)members=parseCsv(await res.text())}catch(e){}if(!members.length)members=[{id:'taehoon',name_kr:'김태훈',name_en:'Taehoon Kim',title_kr:'대표',title_en:'Representative',phone:'+84 093 685 0555',email:'kim@bambooasia.biz'},{id:'magnox',name_kr:'정성영',name_en:'Seongyoung Jeong',title_kr:'팀장',title_en:'Team Manager',phone:'+84 093 896 7541',email:'magnox@bambooasia.biz'}];if(id&&id!=='card'){const m=members.find(x=>x.id===id)||members[0];renderCard(m)}else{renderList(members)}}
main();
</script>
</body>
</html>
