<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>b/a Digital Card · Bamboo Asia</title>
<meta name="robots" content="noindex"/>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
body{background:#0C1611;color:#F9F5EB;display:flex;flex-direction:column;align-items:center}
.bg{pointer-events:none;position:fixed;inset:0;overflow:hidden;z-index:0}
.bg i{position:absolute;border-radius:50%;filter:blur(110px)}
.bg i:nth-child(1){top:-30%;left:-10%;width:80%;height:60%;background:rgba(20,83,45,.35)}
.bg i:nth-child(2){top:20%;right:-15%;width:70%;height:50%;background:rgba(194,167,122,.2)}
.wrap{position:relative;z-index:1;width:100%;max-width:420px;padding:max(20px,env(safe-area-inset-top)) 1.25rem 2rem}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.brand{display:flex;align-items:center;gap:.75rem}
.logo{width:30px;height:30px;border-radius:10px;background:#F9F5EB;color:#0C1611;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.brand small{display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;opacity:.55}
.hint{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.4;text-align:center;margin:0 0 1rem}
.stage{perspective:1600px;width:100%}
.flip{position:relative;width:100%;min-height:640px;transition:transform .9s cubic-bezier(.4,.0,.2,1);transform-style:preserve-3d;cursor:pointer}
.flip.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:32px;overflow:hidden;backface-visibility:hidden;display:flex;flex-direction:column;padding:1.75rem}
.front{background:#FDF8EE;color:#0C1611;box-shadow:0 30px 80px -20px rgba(0,0,0,.75),0 0 0 1px rgba(194,167,122,.28) inset}
.back{background:#0C1611;color:#F9F5EB;transform:rotateY(180deg);box-shadow:0 30px 80px -20px rgba(0,0,0,.8),0 0 0 1px rgba(194,167,122,.22) inset;background-image:linear-gradient(to bottom right,rgba(23,53,33,.6),#0C1611,#1a2a1f)}
.mark{font-family:Georgia,serif;font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1}
.gold{height:2px;width:40px;background:#14532D;margin:.5rem 0}
.name{font-family:Georgia,serif;font-size:40px;font-weight:600;line-height:.95;letter-spacing:-.03em;margin:1.5rem 0 .35rem}
.name-en{font-size:13px;opacity:.5;font-style:italic}
.role{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.6;margin-top:1.25rem}
.org{font-size:13.5px;font-weight:500;margin-top:.5rem;line-height:1.35}
.tagline{font-size:13px;line-height:1.5;opacity:.8;margin-top:auto;padding-top:1.5rem;border-top:1px solid rgba(12,22,17,.1)}
.tagline strong{color:#14532D}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.85rem}
.chip{font-size:11px;padding:.35rem .65rem;border-radius:999px;background:rgba(12,22,17,.06);border:1px solid rgba(12,22,17,.1);color:rgba(12,22,17,.75);text-decoration:none}
.loc{font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:.4;margin-top:.75rem}
.back .sec{font-size:10px;letter-spacing:.2em;text-transform:uppercase;opacity:.35;margin:1.25rem 0 .6rem}
.services{display:flex;flex-wrap:wrap;gap:.4rem}
.services span{font-size:11px;padding:.4rem .75rem;border-radius:999px;background:rgba(249,245,235,.07);border:1px solid rgba(249,245,235,.12)}
.rows{display:flex;flex-direction:column;gap:.65rem;margin-top:.5rem}
.row{display:flex;align-items:center;gap:.75rem;color:rgba(249,245,235,.85);text-decoration:none;font-size:13px}
.ico{width:36px;height:36px;border-radius:999px;background:rgba(249,245,235,.07);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.qr-wrap{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;padding-top:1rem}
.qr-box{width:88px;height:88px;border-radius:12px;background:#F9F5EB;padding:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.qr-box img,.qr-box canvas{width:100%!important;height:100%!important;display:block}
.qr-label{font-size:10px;opacity:.45;letter-spacing:.06em;text-transform:uppercase;text-align:right;line-height:1.45}
.actions{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-top:1.25rem}
.btn{height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:.5rem;font-size:13px;font-weight:500;text-decoration:none;border:0;cursor:pointer;color:inherit;font:inherit}
.btn-light{background:#F9F5EB;color:#0C1611}
.btn-ghost{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#F9F5EB}
.btn-green{background:#14532D;color:#F9F5EB}
.toast{position:fixed;bottom:max(24px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#F9F5EB;color:#0C1611;padding:.6rem 1rem;border-radius:999px;font-size:12px;z-index:50;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:1}
.err{padding:2rem;text-align:center;opacity:.7}
a.backlink{display:inline-block;margin-top:1.25rem;font-size:11px;opacity:.4;color:#C2A77A;text-decoration:none}
.list-card{display:flex;align-items:center;gap:1rem;padding:1rem;border-radius:16px;background:rgba(249,245,235,.06);border:1px solid rgba(249,245,235,.12);color:inherit;text-decoration:none}
.list-card:hover{background:rgba(249,245,235,.1)}
.wallet-tip{margin-top:1rem;padding:.85rem 1rem;border-radius:14px;background:rgba(249,245,235,.06);border:1px solid rgba(249,245,235,.1);font-size:12px;line-height:1.5;opacity:.85}
.wallet-tip strong{color:#C2A77A;font-weight:600}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<div class="bg"><i></i><i></i></div>
<div class="wrap" id="app"><p class="err">Loading…</p></div>
<div class="toast" id="toast"></div>
<script>
const CSV_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vROc_VAnbXFlbCyCAYvO4P0R6fEJgktqkNCrvShvUzgHBCv-10R5kXprgRpQFuYXM29tTXMTWp7eFXz/pub?gid=0&single=true&output=csv';
const SITE='https://b-a.bambooasia.biz';
const FALLBACK=[
  {id:'taehoon',name_kr:'김태훈',name_en:'Taehoon Kim',title_kr:'대표',title_en:'Representative',phone:'+84 093 685 0555',email:'kim@bambooasia.biz'},
  {id:'magnox',name_kr:'정성영',name_en:'Seongyoung Jeong',title_kr:'팀장',title_en:'Team Manager',phone:'+84 093 896 7541',email:'magnox@bambooasia.biz'}
];
function parseCsv(text){
  const lines=text.replace(/^\uFEFF/,'').trim().split(/\r?\n/);
  if(lines.length<2)return [];
  const headers=lines[0].split(',').map(h=>h.trim());
  return lines.slice(1).filter(Boolean).map(line=>{
    const cols=line.split(',');const row={};
    headers.forEach((h,i)=>row[h]=(cols[i]||'').trim());
    return row;
  }).filter(r=>r.id);
}
function telHref(phone){
  let d=String(phone||'').replace(/[^\d+]/g,'');
  if(!d.startsWith('+')&&d.startsWith('84'))d='+'+d;
  return 'tel:'+d;
}
function phoneDigits(phone){
  return telHref(phone).replace('tel:','');
}
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('on');
  setTimeout(()=>el.classList.remove('on'),2200);
}
function memberId(){
  const q=new URLSearchParams(location.search).get('id');
  if(q)return q;
  const parts=location.pathname.replace(/\/+$/,'').split('/');
  const i=parts.indexOf('card');
  if(i>=0&&parts[i+1])return parts[i+1];
  return null;
}
function buildVCard(m){
  const fn=m.name_kr||m.name_en||m.id||'';
  const n=m.name_kr||m.name_en||'';
  const title=m.title_en||m.title_kr||'';
  const tel=phoneDigits(m.phone);
  const email=m.email||'';
  return [
    'BEGIN:VCARD',
    'VERSION:3.0',
    'FN:'+fn,
    'N:'+n+';;;;',
    'ORG:b/a - Bamboo Asia',
    'TITLE:'+title,
    tel?'TEL;TYPE=CELL,VOICE:'+tel:'',
    email?'EMAIL;TYPE=INTERNET:'+email:'',
    'URL:'+SITE,
    'NOTE:Vietnam Business Execution Platform · b-a.bambooasia.biz',
    'END:VCARD'
  ].filter(Boolean).join('\n');
}
function downloadVCard(m){
  const v=buildVCard(m);
  const blob=new Blob([v],{type:'text/vcard;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='b-a_'+(m.name_kr||m.id||'card').replace(/\s+/g,'_')+'.vcf';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
  toast('vCard 저장됨 · 연락처 앱에서 열기');\n}
function renderQr(el, text){
  if(!el)return;
  el.innerHTML='';
  try{
    if(typeof QRCode!=='undefined'){
      new QRCode(el,{
        text:text,
        width:140,
        height:140,
        colorDark:'#0C1611',
        colorLight:'#F9F5EB',
        correctLevel:QRCode.CorrectLevel.M
      });
    }else{
      const img=document.createElement('img');
      img.alt='vCard QR';
      img.src='https://api.qrserver.com/v1/create-qr-code/?size=140x140&margin=0&data='+encodeURIComponent(text);
      el.appendChild(img);
    }
  }catch(e){
    el.textContent='QR';
  }
}
function renderList(members){
  document.title='b/a Digital Cards · Bamboo Asia';
  document.getElementById('app').innerHTML=`
    <header><div class="brand"><div class="logo">b/a</div><div><small>Bamboo Asia</small><small style="opacity:.35">Digital Cards</small></div></div></header>
    <p class="hint">멤버 선택</p>
    <div style="display:flex;flex-direction:column;gap:.75rem;width:100%">
      ${members.map(m=>`
        <a class="list-card" href="/card/${m.id}/">
          <div class="logo">b/a</div>
          <div style="flex:1"><div style="font-weight:600">${m.name_kr||m.name_en}</div>
          <div style="font-size:12px;opacity:.5">${m.name_en||''}</div>
          <div style="font-size:11px;opacity:.4;margin-top:4px;text-transform:uppercase;letter-spacing:.06em">${m.title_kr||m.title_en||''}</div></div>
          <span style="opacity:.35">→</span>
        </a>`).join('')}
    </div>
    <a class="backlink" href="/">← b/a home</a>`;
}
function renderCard(m){
  const role=(m.title_en||m.title_kr||'Representative')+' / 베트남 사업 실행 플랫폼';
  const vcard=buildVCard(m);
  document.title=`b/a Digital Card · ${m.name_kr||m.name_en} · Bamboo Asia`;
  document.getElementById('app').innerHTML=`
    <header>
      <div class="brand"><div class="logo">b/a</div><div><small>Bamboo Asia · 2025</small><small style="opacity:.35">b-a.bambooasia.biz</small></div></div>
    </header>
    <p class="hint">Tap card to flip · 뒤집기</p>
    <div class="stage"><div class="flip" id="flip">
      <div class="face front">
        <div class="mark">[ b/a ]</div>
        <div class="gold"></div>
        <div style="font-size:9px;letter-spacing:.18em;text-transform:uppercase;opacity:.4">Bamboo Asia · Est. 2025</div>
        <div class="name">${m.name_kr||m.name_en||''}</div>
        <div class="name-en">${m.name_en||''}</div>
        <div class="role">${role}</div>
        <div class="org">b/a Bamboo Asia<br><span style="opacity:.6;font-weight:400;font-size:12px">Vietnam Business Execution Platform</span></div>
        <div class="tagline">베트남 진출의 모든 과정을<br><strong>하나의 파트너</strong>와 함께</div>
        <div class="chips">
          <a class="chip" href="${telHref(m.phone)}">${m.phone||''}</a>
          <a class="chip" href="mailto:${m.email||''}">${m.email||''}</a>
        </div>
        <div class="loc">Ho Chi Minh City · Seoul</div>
      </div>
      <div class="face back">
        <div style="display:flex;align-items:center;gap:.75rem">
          <div class="logo">b/a</div>
          <div><div style="font-size:11px;letter-spacing:.18em;text-transform:uppercase;opacity:.8">Bamboo Asia</div>
          <div style="font-size:10px;opacity:.4">b-a.bambooasia.biz</div></div>
        </div>
        <div style="margin-top:1.25rem;font-family:Georgia,serif;font-size:15px">${m.name_kr||''} <span style="opacity:.5;font-size:12px;font-family:system-ui">${m.name_en||''}</span></div>
        <div class="sec">Services</div>
        <div class="services">
          <span>법인설립</span><span>거래·M&A</span><span>산업별 현지화</span><span>보안·준법</span><span>운영지원</span>
        </div>
        <div class="sec">Contact</div>
        <div class="rows">
          <a class="row" href="${telHref(m.phone)}"><span class="ico">☎</span>${m.phone||''}</a>
          <a class="row" href="mailto:${m.email||''}"><span class="ico">✉</span>${m.email||''}</a>
          <a class="row" href="${SITE}" target="_blank" rel="noopener"><span class="ico">🌐</span>b-a.bambooasia.biz</a>
        </div>
        <div class="qr-wrap">
          <div class="qr-box" id="qrBox"></div>
          <div class="qr-label">Scan to save contact<br>vCard · 연락처 저장<br>Google / Apple</div>
        </div>
      </div>
    </div></div>
    <div class="actions">
      <a class="btn btn-light" href="${telHref(m.phone)}">전화하기</a>
      <a class="btn btn-ghost" href="mailto:${m.email||''}">이메일</a>
      <button class="btn btn-green" type="button" id="vcardBtn">연락처 저장</button>
      <button class="btn btn-ghost" type="button" id="shareBtn">공유하기</button>
    </div>
    <div class="actions" style="margin-top:.75rem">
      <button class="btn btn-ghost" type="button" id="copyBtn" style="height:44px">링크 복사</button>
      <a class="btn btn-ghost" href="${SITE}" target="_blank" rel="noopener" style="height:44px">웹사이트</a>
    </div>
    <div class="wallet-tip">
      <strong>Google Wallet / 연락처</strong><br>
      1) <b>연락처 저장</b> → .vcf 파일을 열어 주소록에 추가<br>
      2) 카드 뒷면 <b>QR 스캔</b> → 카메라로 바로 연락처 추가<br>
      3) Google Wallet: 저장된 QR 이미지를 Wallet → 추가 → 사진 으로도 등록 가능
    </div>
    <a class="backlink" href="/card/">← 멤버 목록</a>`;
  const flip=document.getElementById('flip');
  flip.addEventListener('click',(e)=>{
    if(e.target.closest('a,button,input,.qr-box'))return;
    flip.classList.toggle('on');
  });
  renderQr(document.getElementById('qrBox'), vcard);
  document.getElementById('vcardBtn').onclick=()=>downloadVCard(m);
  document.getElementById('copyBtn').onclick=async()=>{
    const url=`${SITE}/card/${m.id}/`;
    try{await navigator.clipboard.writeText(url);}catch{}
    toast('링크 복사됨');
  };
  document.getElementById('shareBtn').onclick=async()=>{
    const url=`${SITE}/card/${m.id}/`;
    try{
      if(navigator.share){
        await navigator.share({
          title:`b/a · ${m.name_kr||m.name_en}`,
          text:`${m.name_kr||m.name_en} · ${m.title_kr||m.title_en||''} · Bamboo Asia`,
          url
        });
      }else{
        await navigator.clipboard.writeText(url);
      }
    }catch{}
    toast('공유 준비 완료');
  };
}
(async function(){
  let members=FALLBACK;
  try{
    const res=await fetch(CSV_URL);
    if(res.ok){
      const parsed=parseCsv(await res.text());
      if(parsed.length)members=parsed;
    }
  }catch(e){}
  const id=memberId();
  if(!id){renderList(members);return;}
  const m=members.find(x=>x.id===id)||members[0];
  if(!m){document.getElementById('app').innerHTML='<p class="err">Member not found</p>';return;}
  renderCard(m);
})();
</script>
</body>
</html>
