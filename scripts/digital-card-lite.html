<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>b/a Digital Card · Bamboo Asia</title>
<meta name="robots" content="noindex"/>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
body{background:#0C1611;color:#F9F5EB;display:flex;flex-direction:column;align-items:center}
.bg{pointer-events:none;position:fixed;inset:0;overflow:hidden;z-index:0}
.bg i{position:absolute;border-radius:50%;filter:blur(110px)}
.bg i:nth-child(1){top:-30%;left:-10%;width:80%;height:60%;background:rgba(20,83,45,.35)}
.bg i:nth-child(2){top:20%;right:-15%;width:70%;height:50%;background:rgba(194,167,122,.2)}
.wrap{position:relative;z-index:1;width:100%;max-width:420px;padding:max(20px,env(safe-area-inset-top)) 1.25rem 2rem}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.brand{display:flex;align-items:center;gap:.75rem}
.logo{width:30px;height:30px;border-radius:10px;background:#F9F5EB;color:#0C1611;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.brand small{display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;opacity:.55}
.hint{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.4;text-align:center;margin:0 0 1rem}
.stage{perspective:1600px;width:100%}
.flip{position:relative;width:100%;min-height:560px;transition:transform .9s cubic-bezier(.4,.0,.2,1);transform-style:preserve-3d;cursor:pointer}
.flip.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:32px;overflow:hidden;backface-visibility:hidden;display:flex;flex-direction:column;padding:1.75rem}
.front{background:#FDF8EE;color:#0C1611;box-shadow:0 30px 80px -20px rgba(0,0,0,.75),0 0 0 1px rgba(194,167,122,.28) inset}
.back{background:#0C1611;color:#F9F5EB;transform:rotateY(180deg);box-shadow:0 30px 80px -20px rgba(0,0,0,.8),0 0 0 1px rgba(194,167,122,.22) inset;background-image:linear-gradient(to bottom right,rgba(23,53,33,.6),#0C1611,#1a2a1f)}
.mark{font-family:Georgia,serif;font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1}
.gold{height:2px;width:40px;background:#14532D;margin:.5rem 0}
.name{font-family:Georgia,serif;font-size:40px;font-weight:600;line-height:.95;letter-spacing:-.03em;margin:1.5rem 0 .35rem}
.name-en{font-size:13px;opacity:.5;font-style:italic}
.role{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.6;margin-top:1.25rem}
.org{font-size:13.5px;font-weight:500;margin-top:.5rem;line-height:1.35}
.tagline{font-size:13px;line-height:1.5;opacity:.8;margin-top:auto;padding-top:1.5rem;border-top:1px solid rgba(12,22,17,.1)}
.tagline strong{color:#14532D}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.85rem}
.chip{font-size:11px;padding:.35rem .65rem;border-radius:999px;background:rgba(12,22,17,.06);border:1px solid rgba(12,22,17,.1);color:rgba(12,22,17,.75);text-decoration:none}
.front-head{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;width:100%}
.front-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;margin-top:auto;padding-top:1rem}
.loc{font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:.4;line-height:1.45}
.qr-front,.qr-back{width:56px;height:56px;min-width:56px;min-height:56px;max-width:56px;max-height:56px;border-radius:12px;background:#fff;padding:4px;border:1px solid rgba(12,22,17,.12);display:block;flex-shrink:0;box-shadow:0 4px 14px rgba(12,22,17,.1);overflow:hidden;position:relative;box-sizing:border-box}
.qr-back{border-color:rgba(249,245,235,.18);box-shadow:0 4px 14px rgba(0,0,0,.3)}
.qr-front canvas,.qr-front img,.qr-back canvas,.qr-back img{position:absolute!important;top:4px!important;left:4px!important;width:calc(100% - 8px)!important;height:calc(100% - 8px)!important;max-width:none!important;max-height:none!important;object-fit:contain!important;display:block!important;margin:0!important;padding:0!important}
.back-head{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;width:100%}
.back .sec{font-size:10px;letter-spacing:.2em;text-transform:uppercase;opacity:.35;margin:1.1rem 0 .55rem}
.services{display:flex;flex-wrap:wrap;gap:.4rem}
.services span{font-size:11px;padding:.4rem .75rem;border-radius:999px;background:rgba(249,245,235,.07);border:1px solid rgba(249,245,235,.12)}
.rows{display:flex;flex-direction:column;gap:.65rem;margin-top:.5rem}
.row{display:flex;align-items:center;gap:.75rem;color:rgba(249,245,235,.85);text-decoration:none;font-size:13px}
.ico{width:36px;height:36px;border-radius:999px;background:rgba(249,245,235,.07);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.qr-note{margin-top:auto;padding-top:1rem;font-size:10px;opacity:.4;letter-spacing:.06em;text-transform:uppercase;line-height:1.45;text-align:left}
.actions{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-top:1.25rem}
.btn{height:48px;border-radius:999px;border:0;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:inherit}
.btn-light{background:#F9F5EB;color:#0C1611}
.btn-ghost{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#F9F5EB}
.btn-green{background:#14532D;color:#F9F5EB}
.toast{position:fixed;bottom:max(24px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#F9F5EB;color:#0C1611;padding:.6rem 1rem;border-radius:999px;font-size:12px;z-index:50;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:1}
.err{padding:2rem;text-align:center;opacity:.7}
a.backlink{display:inline-block;margin-top:1.25rem;font-size:11px;opacity:.4;color:#C2A77A;text-decoration:none}
.list-card{display:flex;align-items:center;gap:1rem;padding:1rem;border-radius:16px;background:rgba(249,245,235,.06);border:1px solid rgba(249,245,235,.12);color:inherit;text-decoration:none}
.list-card:hover{background:rgba(249,245,235,.1)}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<div class="bg"><i></i><i></i></div>
<div class="wrap" id="app"><p class="err">Loading…</p></div>
<div class="toast" id="toast"></div>
<script>
const CSV_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vROc_VAnbXFlbCyCAYvO4P0R6fEJgktqkNCrvShvUzgHBCv-10R5kXprgRpQFuYXM29tTXMTWp7eFXz/pub?gid=0&single=true&output=csv';
const SITE='https://b-a.bambooasia.biz';
function cardUrl(id){return SITE+'/card/?id='+encodeURIComponent(id);}
function cardPath(id){return '/card/?id='+encodeURIComponent(id);}
const FALLBACK=[
  {id:'taehoon',name_kr:'김태훈',name_en:'Taehoon Kim',title_kr:'대표',title_en:'Representative',phone:'+84 093 685 0555',email:'kim@bambooasia.biz'},
  {id:'magnox',name_kr:'정성영',name_en:'Seongyoung Jeong',title_kr:'팀장',title_en:'Team Manager',phone:'+84 093 896 7541',email:'magnox@bambooasia.biz'},
  {id:'byeonggyu',name_kr:'임병규',name_en:'Byeonggyu Lim',title_kr:'이사',title_en:'General Project Manager',phone:'+84 078 449 0386',email:'lim@bambooasia.biz'}
];
function parseCsv(text){
  const lines=text.replace(/^\uFEFF/,'').trim().split(/\r?\n/);
  if(lines.length<2)return [];
  const headers=lines[0].split(',').map(h=>h.trim());
  return lines.slice(1).filter(Boolean).map(line=>{
    const cols=line.split(',');const row={};
    headers.forEach((h,i)=>row[h]=(cols[i]||'').trim());
    return row;
  }).filter(r=>r.id);
}
function telHref(phone){
  let d=String(phone||'').replace(/[^\d+]/g,'');
  if(!d.startsWith('+')&&d.startsWith('84'))d='+'+d;
  return 'tel:'+d;
}
function phoneDigits(phone){return telHref(phone).replace('tel:','');}
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('on');
  setTimeout(()=>el.classList.remove('on'),2200);
}
function memberId(){
  if(typeof window.__CARD_ID__==='string'&&window.__CARD_ID__)return window.__CARD_ID__;
  const q=new URLSearchParams(location.search).get('id');
  if(q)return String(q).replace(/\/+$/,'').trim();
  const parts=location.pathname.replace(/\/+$/,'').split('/').filter(Boolean);
  const skip=new Set(['card','index.html','card-spa.html','card-spa']);
  const i=parts.indexOf('card');
  if(i>=0){
    for(let j=i+1;j<parts.length;j++){
      const seg=parts[j];
      if(seg&&!skip.has(seg)&&!/\.html?$/i.test(seg))return seg;
    }
  }
  return null;
}
function buildVCard(m){
  const fn=m.name_kr||m.name_en||m.id||'';
  const title=m.title_en||m.title_kr||'';
  const tel=phoneDigits(m.phone);
  const email=m.email||'';
  return ['BEGIN:VCARD','VERSION:3.0','FN:'+fn,'N:'+fn+';;;;','ORG:b/a - Bamboo Asia','TITLE:'+title,tel?'TEL;TYPE=CELL:'+tel:'',email?'EMAIL:'+email:'','URL:'+SITE,'END:VCARD'].filter(Boolean).join('\n');
}
function downloadVCard(m){
  const blob=new Blob([buildVCard(m)],{type:'text/vcard;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='b-a_'+(m.name_kr||m.id||'card').replace(/\s+/g,'_')+'.vcf';
  a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);toast('vCard 저장됨');
}
function downloadQrImage(m){
  const text=buildVCard(m);const size=512;
  const filename='b-a_QR_'+(m.name_kr||m.id||'card').replace(/\s+/g,'_')+'.png';
  const url='https://api.qrserver.com/v1/create-qr-code/?size='+size+'x'+size+'&margin=8&format=png&data='+encodeURIComponent(text);
  const a=document.createElement('a');a.href=url;a.download=filename;a.target='_blank';a.rel='noopener';a.click();toast('QR 이미지 열림');
}
function renderQr(el,text,size){
  if(!el)return;
  el.innerHTML='';
  const px=size||48;
  el.style.width='56px';
  el.style.height='56px';
  el.style.minWidth='56px';
  el.style.minHeight='56px';
  el.style.position='relative';
  el.style.overflow='hidden';
  const drawImg=()=>{
    el.innerHTML='';
    const img=document.createElement('img');
    img.alt='QR';
    img.width=px;img.height=px;
    img.style.cssText='position:absolute;top:4px;left:4px;width:calc(100% - 8px);height:calc(100% - 8px);object-fit:contain;display:block';
    img.src='https://api.qrserver.com/v1/create-qr-code/?size='+px+'x'+px+'&margin=1&data='+encodeURIComponent(text);
    el.appendChild(img);
  };
  try{
    if(typeof QRCode==='undefined'){drawImg();return;}
    new QRCode(el,{text:text,width:px,height:px,colorDark:'#0C1611',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.L});
    const canvas=el.querySelector('canvas');
    const img=el.querySelector('img');
    if(canvas){
      canvas.style.cssText='position:absolute;top:4px;left:4px;width:calc(100% - 8px)!important;height:calc(100% - 8px)!important;display:block';
      if(img)img.style.display='none';
    }else if(img){
      img.style.cssText='position:absolute;top:4px;left:4px;width:calc(100% - 8px);height:calc(100% - 8px);object-fit:contain;display:block';
    }else drawImg();
  }catch(e){drawImg();}
}
function renderList(members){
  document.title='b/a Digital Cards';
  document.getElementById('app').innerHTML=`<header><div class="brand"><div class="logo">b/a</div><div><small>Bamboo Asia</small></div></div></header><p class="hint">멤버 선택</p><div style="display:flex;flex-direction:column;gap:.75rem">${members.map(m=>`<a class="list-card" href="${cardPath(m.id)}"><div class="logo">b/a</div><div style="flex:1"><div style="font-weight:600">${m.name_kr||m.id}</div><div style="font-size:12px;opacity:.55">${m.name_en||''}</div><div style="font-size:11px;opacity:.4">${m.title_kr||m.title_en||''}</div></div><div style="opacity:.4">→</div></a>`).join('')}</div><a class="backlink" href="/">← b/a home</a>`;
}
function renderCard(m){
  const role=m.title_en?(m.title_en+' / 베트남 사업 실행 플랫폼'):((m.title_kr||'Representative')+' / 베트남 사업 실행 플랫폼');
  const vcard=buildVCard(m);
  document.title='b/a · '+(m.name_kr||m.id);
  document.getElementById('app').innerHTML=`<header><div class="brand"><div class="logo">b/a</div><div><small>Bamboo Asia</small></div></div></header><p class="hint">Tap card to flip</p><div class="stage"><div class="flip" id="flip"><div class="face front"><div class="front-head"><div><div class="mark">[ b/a ]</div><div class="gold"></div></div><div class="qr-front" id="qrFront"></div></div><div class="name">${m.name_kr||m.name_en||''}</div><div class="name-en">${m.name_en||''}</div><div class="role">${role}</div><div class="org">b/a Bamboo Asia</div><div class="tagline">베트남 진출의 모든 과정을 <strong>하나의 파트너</strong>와 함께</div><div class="chips"><a class="chip" href="${telHref(m.phone)}">${m.phone||''}</a><a class="chip" href="mailto:${m.email||''}">${m.email||''}</a></div><div class="front-foot"><div class="loc">Ho Chi Minh City · Seoul</div></div></div><div class="face back"><div class="back-head"><div style="display:flex;gap:.75rem;align-items:center"><div class="logo">b/a</div><div><div style="font-size:11px;letter-spacing:.18em;text-transform:uppercase">Bamboo Asia</div></div></div><div class="qr-back" id="qrBox"></div></div><div style="margin-top:1rem;font-family:Georgia,serif">${m.name_kr||''} <span style="opacity:.5;font-size:12px">${m.name_en||''}</span></div><div class="sec">Contact</div><div class="rows"><a class="row" href="${telHref(m.phone)}"><span class="ico">☎</span>${m.phone||''}</a><a class="row" href="mailto:${m.email||''}"><span class="ico">✉</span>${m.email||''}</a><a class="row" href="${SITE}" target="_blank" rel="noopener"><span class="ico">🌐</span>b-a.bambooasia.biz</a></div><div class="qr-note">Scan QR · vCard</div></div></div></div><div class="actions"><a class="btn btn-light" href="${telHref(m.phone)}">전화하기</a><a class="btn btn-ghost" href="mailto:${m.email||''}">이메일</a><button class="btn btn-green" type="button" id="vcardBtn">연락처 저장</button><button class="btn btn-ghost" type="button" id="qrSaveBtn">QR 저장</button></div><div class="actions" style="margin-top:.75rem"><button class="btn btn-ghost" type="button" id="shareBtn" style="height:44px">공유하기</button><button class="btn btn-ghost" type="button" id="copyBtn" style="height:44px">링크 복사</button></div><a class="backlink" href="/card/">← 멤버 목록</a>`;
  document.getElementById('flip').onclick=function(e){if(e.target.closest('a,button,.qr-front,.qr-back'))return;this.classList.toggle('on');};
  renderQr(document.getElementById('qrFront'),vcard,48);
  renderQr(document.getElementById('qrBox'),vcard,48);
  document.getElementById('vcardBtn').onclick=function(){downloadVCard(m);};
  document.getElementById('qrSaveBtn').onclick=function(){downloadQrImage(m);};
  document.getElementById('copyBtn').onclick=async function(){try{await navigator.clipboard.writeText(cardUrl(m.id));}catch(e){}toast('링크 복사됨');};
  document.getElementById('shareBtn').onclick=async function(){const url=cardUrl(m.id);try{if(navigator.share)await navigator.share({title:'b/a · '+(m.name_kr||m.name_en),url});else{await navigator.clipboard.writeText(url);toast('링크 복사됨');}}catch(e){}};
}
(async function(){
  let members=FALLBACK;
  try{
    const res=await fetch(CSV_URL);
    if(res.ok){
      const parsed=parseCsv(await res.text());
      if(parsed.length)members=parsed;
    }
  }catch(e){}
  const id=memberId();
  if(!id){renderList(members);return;}
  const m=members.find(function(x){return x.id===id;});
  if(!m){
    document.getElementById('app').innerHTML='<p class="err">멤버를 찾을 수 없습니다: <b>'+id+'</b></p><p class="err"><a href="/card/" style="color:#A3E635">명함 목록</a></p>';
    return;
  }
  renderCard(m);
})();
</script>
</body>
</html>
