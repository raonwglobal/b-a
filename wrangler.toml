# Cloudflare Pages 전용 설정 (Workers 아님)
# 로컬: npx wrangler pages dev out
# 배포: Cloudflare Dashboard > Pages (Git) 또는 npx wrangler pages deploy out
#
# 대시보드 필수 설정:
#   Build command:        npm run build
#   Build output directory: out
#   Framework preset:     Next.js (Static HTML Export) 또는 None
#
# 주의: `wrangler deploy` 를 쓰면 entry-point 오류가 납니다. 반드시 Pages 로 배포하세요.

name = "b-a-platform"
compatibility_date = "2024-09-23"
pages_build_output_dir = "out"

# 환경 변수는 Dashboard > Settings > Variables 에만 설정
# GOOGLE_SHEETS_WEBHOOK_URL / CONTACT_EMAIL / RESEND_API_KEY
